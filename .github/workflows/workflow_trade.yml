name: adaptive-trader

on:
  schedule:
    - cron: '*/15 * * * *'      # every 15 minutes (GitHub may still delay it)
  workflow_dispatch:            # manual run button (always reliable)
    inputs:
      dry_run:
        description: 'Dry run (offline synthetic data)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run one tick (paper trading on real Kraken prices, no keys needed)
        run: >
          python tick.py --symbol BTC/USD --timeframe 1h
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Build STATUS.md dashboard + chart
        run: python report.py

      - name: Save everything back to the repo
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add -A
          git commit -m "update: state, trades, dashboard [skip ci]" || echo "no changes to commit"
          git push || echo "nothing to push"
