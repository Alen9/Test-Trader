name: adaptive-trader

on:
  schedule:
    - cron: '5 * * * *'        # every hour, at :05
  workflow_dispatch:            # lets you run it manually from your phone
    inputs:
      dry_run:
        description: 'Dry run (synthetic data, no keys, no orders)'
        type: boolean
        default: true

permissions:
  contents: write               # needed to save state back to the repo

concurrency:
  group: trader                 # never run two ticks at once
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run one tick
        env:
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: >
          python tick.py --symbol BTC/USDT --timeframe 1h
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Save state back to the repo
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add -A state.json trades_log.csv 2>/dev/null || true
          git commit -m "state update [skip ci]" || echo "no changes to commit"
          git push || echo "nothing to push"
